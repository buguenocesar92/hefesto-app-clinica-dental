# =============================================================================
# Hefesto Studio — ClinicaDental: produccion
# =============================================================================
# Postgres, Redis, API, interfaz y Caddy. Solo Caddy publica puertos.
#
# ANTE S DE LEVANTAR ESTO
#   1. Copie `api/.env.example` a `api/.env` y complete los valores.
#   2. Copie `.env.example` a `.env` y complete los valores.
#   3. Genere APP_KEY:
#      `docker compose -f deploy/docker-compose.prod.yml run --rm api php artisan key:generate`
#   4. Cree el consultorio y su primer administrador (ver docs/04).
#   5. Corra `php artisan clinica:verificar-aislamiento` (ver docs/03).
#
# A partir de ahi: esto NO esta listo para atender pacientes reales. Ver docs/07.
# =============================================================================

name: clinica-dental

services:

  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: "docker.io/library/postgres:18.6"
    restart: unless-stopped
    env_file:
      - ../api/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-clinica_dental}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-clinica_dental_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env.prod}
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-clinica_dental}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en api/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clinica_dental} -d ${DB_DATABASE:-clinica_dental}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # NO se publica ningun puerto: PostgreSQL no se alcanza desde afuera.

  redis:
    image: "docker.io/library/redis:8.8.3-alpine"
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
      - --loglevel
      - notice
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Sin puertos publicados: solo la API llega a Redis.

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../api/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
      - bootstrap:/var/www/html/bootstrap/cache
    # Sin puertos publicados: solo Caddy llega a la API.

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_API_BASE: http://api:8000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    depends_on:
      - api
    # Sin puertos publicados: solo Caddy llega a la interfaz.

  caddy:
    image: "docker.io/library/caddy:2.11.7-alpine"
    restart: unless-stopped
    env_file:
      - ../api/.env
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en .env}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres:
    name: clinica_dental_postgres
  redis:
    name: clinica_dental_redis
  storage:
    name: clinica_dental_storage
  bootstrap:
    name: clinica_dental_bootstrap
  caddy_datos:
    name: clinica_dental_caddy_datos
  caddy_config:
    name: clinica_dental_caddy_config