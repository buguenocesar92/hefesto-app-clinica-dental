; =============================================================================
; supervisord de ClinicaDental
; =============================================================================
; Tres procesos: php-fpm (la API), el worker de colas y el planificador de
; tareas. Si el worker de colas no corre, las tareas quedan apiladas y nadie se
; entera: en un consultorio eso significa que el sistema deja de avisar.
;
; NGINX NO ESTA ACA, A PROPOSITO
; ------------------------------
; El `CMD` de la imagen es `supervisord`. Si nginx fuera un cuarto programa
; aqui, habria dos superviseores competes por el mismo archivo de pid y el
; arranque se volveria inestable. En esta aplicacion el contenedor de la API no
; publica puertos y Caddy no le manda trafico HTTP de usuarios, asi que nginx
; queda como proceso interno de php-fpm y lo lanza la imagen base.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cola]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; El worker tiene que morir y volver para no arrastrar el contexto de una
; peticion a la siguiente. Es especialmente importante aca: si arrastrara el
; `app.tenant_id` de una transaccion, una tarea leeria datos de otro
; consultorio. Ver docs/03.
stopasgroup=true
killasgroup=true

[program:planificador]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0